name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: mantit0985/.github/.github/workflows/ci.yml@main
    with:
      language: 'rust'
      smoke-image: 'rust-template:slim'
      build-verify-cmd: 'docker build --target runtime-slim -t rust-template:slim .'
